[project]
name = "moneytrace"
version = "0.1.0"
description = "Personal finance tracking - conservative budgeting, event-driven ledger"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "db-sqlite3>=0.0.1",
    "pydantic>=2.12.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pytest>=9.0.2",
]

[project.scripts]
moneytrace = "moneytrace.cli:main"
moneytrace-server = "moneytrace.server:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]

