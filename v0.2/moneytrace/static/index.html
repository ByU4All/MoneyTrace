<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Personal finance tracking - conservative budgeting">

    <title>MoneyTrace</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <h1 class="header-title">MoneyTrace</h1>
            <button class="header-btn" id="settings-btn" aria-label="Settings">⚙️</button>
        </header>

        <!-- Main content -->
        <main class="main" id="main-content">
            <div class="loading">Loading...</div>
        </main>

        <!-- Bottom navigation -->
        <nav class="nav">
            <button class="nav-btn active" data-screen="dashboard">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Dashboard</span>
            </button>
            <button class="nav-btn" data-screen="add">
                <span class="nav-icon">➕</span>
                <span class="nav-label">Add</span>
            </button>
            <button class="nav-btn" data-screen="friends">
                <span class="nav-icon">👥</span>
                <span class="nav-label">Friends</span>
            </button>
            <button class="nav-btn" data-screen="history">
                <span class="nav-icon">📜</span>
                <span class="nav-label">History</span>
            </button>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/screens.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
