<!DOCTYPE html>
<html>
<head>
    <title>Static File Test</title>
</head>
<body>
    <h1>Testing Static Files</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        // Test if scripts loaded
        results.innerHTML += '<p>Testing script loading...</p>';

        if (typeof API !== 'undefined') {
            results.innerHTML += '<p>✓ API loaded</p>';
        } else {
            results.innerHTML += '<p>✗ API NOT loaded</p>';
        }

        if (typeof Screens !== 'undefined') {
            results.innerHTML += '<p>✓ Screens loaded</p>';
        } else {
            results.innerHTML += '<p>✗ Screens NOT loaded</p>';
        }

        if (typeof App !== 'undefined') {
            results.innerHTML += '<p>✓ App loaded</p>';
        } else {
            results.innerHTML += '<p>✗ App NOT loaded</p>';
        }
    </script>

    <script src="/js/api.js"></script>
    <script src="/js/screens.js"></script>
    <script src="/js/app.js"></script>

    <script>
        // Re-test after loading
        setTimeout(() => {
            results.innerHTML += '<hr><p>After loading scripts:</p>';

            if (typeof API !== 'undefined') {
                results.innerHTML += '<p>✓ API loaded</p>';
            } else {
                results.innerHTML += '<p>✗ API NOT loaded</p>';
            }

            if (typeof Screens !== 'undefined') {
                results.innerHTML += '<p>✓ Screens loaded</p>';
            } else {
                results.innerHTML += '<p>✗ Screens NOT loaded</p>';
            }

            if (typeof App !== 'undefined') {
                results.innerHTML += '<p>✓ App loaded</p>';
            } else {
                results.innerHTML += '<p>✗ App NOT loaded</p>';
            }
        }, 100);
    </script>
</body>
</html>
