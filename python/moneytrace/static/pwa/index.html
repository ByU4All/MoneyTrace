<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <title>MoneyTrace</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <h1>MoneyTrace</h1>
        </header>

        <!-- Main content area -->
        <main class="app-main">
            <div class="loading">Loading...</div>
        </main>

        <!-- Navigation -->
        <nav class="app-nav">
            <button class="nav-btn active" data-screen="dashboard">
                <span>📊</span>
                <span>Dashboard</span>
            </button>
            <button class="nav-btn" data-screen="add-event">
                <span>➕</span>
                <span>Add</span>
            </button>
            <button class="nav-btn" data-screen="friends">
                <span>👥</span>
                <span>Friends</span>
            </button>
            <button class="nav-btn" data-screen="categories">
                <span>📂</span>
                <span>Categories</span>
            </button>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js?v=1.0.1"></script>
    <script src="/js/screens.js?v=1.0.1"></script>
    <script src="/js/app.js?v=1.0.1"></script>
</body>
</html>
